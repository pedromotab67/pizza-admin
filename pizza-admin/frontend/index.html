<!DOCTYPE html>
<!-- Tela de login e cadastro do sistema - [Pedro Mota Batista] -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIZZA ADMIN</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
  <style>
    .login-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 2px solid #2a2a2a;
    }
    .login-tab {
      flex: 1;
      background: none;
      border: none;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 0;
      cursor: pointer;
      transition: color 0.2s;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .login-tab.active {
      color: #f59e0b;
      border-bottom: 2px solid #f59e0b;
      margin-bottom: -2px;
    }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .alert-sucesso {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-logo">🍕</div>
    <h1>PIZZA ADMIN</h1>
    <p class="login-subtitle">Painel de gestão</p>

    <div class="login-tabs">
      <button class="login-tab active" onclick="mostrarAba('login')">Entrar</button>
      <button class="login-tab" onclick="mostrarAba('cadastro')">Cadastrar</button>
    </div>

    <div id="mensagem" class="alert hidden"></div>

    <!-- Formulario de Login -->
    <div id="secao-login" class="form-section active">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary btn-block" onclick="login()">Entrar</button>
      <p class="login-hint">admin@pizzaria.com / admin123</p>
    </div>

    <!-- Formulario de Cadastro -->
    <div id="secao-cadastro" class="form-section">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="cadastro-nome" placeholder="Seu nome completo"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="cadastro-email" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="cadastro-senha" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label>Confirmar Senha</label>
        <input type="password" id="cadastro-confirmar" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary btn-block" onclick="cadastrar()">Criar Conta</button>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) window.location.href = '/pages/dashboard.html';

    function mostrarAba(aba) {
      document.getElementById('mensagem').classList.add('hidden');
      document.querySelectorAll('.login-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && aba === 'login') || (i === 1 && aba === 'cadastro'));
      });
      document.getElementById('secao-login').classList.toggle('active', aba === 'login');
      document.getElementById('secao-cadastro').classList.toggle('active', aba === 'cadastro');
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = 'alert ' + (tipo === 'erro' ? 'alert-erro' : 'alert-sucesso');
      el.classList.remove('hidden');
    }

    // Realiza login usando Axios e armazena o token JWT - [Pedro Mota Batista]
    async function login() {
      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;
      document.getElementById('mensagem').classList.add('hidden');
      try {
        const res = await axios.post('/api/usuarios/login', { email, senha });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('nomeUsuario', res.data.nome);
        window.location.href = '/pages/dashboard.html';
      } catch (e) {
        mostrarMensagem(e.response?.data?.erro || 'Erro ao conectar ao servidor', 'erro');
      }
    }

    // Realiza cadastro de novo usuario - [Pedro Mota Batista]
    async function cadastrar() {
      const nome      = document.getElementById('cadastro-nome').value.trim();
      const email     = document.getElementById('cadastro-email').value.trim();
      const senha     = document.getElementById('cadastro-senha').value;
      const confirmar = document.getElementById('cadastro-confirmar').value;

      if (!nome || !email || !senha)
        return mostrarMensagem('Preencha todos os campos.', 'erro');

      if (senha !== confirmar)
        return mostrarMensagem('As senhas nao conferem.', 'erro');

      if (senha.length < 6)
        return mostrarMensagem('A senha deve ter pelo menos 6 caracteres.', 'erro');

      try {
        await axios.post('/api/usuarios/cadastro', { nome, email, senha });
        mostrarMensagem('Conta criada com sucesso! Faca o login.', 'sucesso');
        document.getElementById('cadastro-nome').value = '';
        document.getElementById('cadastro-email').value = '';
        document.getElementById('cadastro-senha').value = '';
        document.getElementById('cadastro-confirmar').value = '';
        setTimeout(() => mostrarAba('login'), 1800);
      } catch (e) {
        mostrarMensagem(e.response?.data?.erro || 'Erro ao criar conta.', 'erro');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('secao-login').classList.contains('active')) login();
        else cadastrar();
      }
    });
  </script>
</body>
</html>
